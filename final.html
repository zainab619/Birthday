<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Real Gift 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fdf6f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .moving-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(#f3dcd1 2px, transparent 2px),
                radial-gradient(#ffffff 1.5px, transparent 1.5px),
                radial-gradient(#f3dcd1 2px, transparent 2px);
            background-size: 40px 40px, 30px 30px, 50px 50px;
            background-position: 0 0, 15px 15px, 25px 25px;
            animation: moveStars 40s linear infinite;
            opacity: 0.8;
        }

        @keyframes moveStars {
            from { background-position: 0 0, 15px 15px, 25px 25px; }
            to { background-position: 500px 500px, 515px 515px, 525px 525px; }
        }

        .final-card {
            background-color: rgba(255, 255, 255, 0.85);
            border: 2px solid #e0cfc2;
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #4a3121;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        p.audio-hint {
            color: #7a5c4d;
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* مشغل الصوت الأنيق */
        audio {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 30px;
        }

        .final-quote {
            border-top: 2px dashed #ebd5c8;
            padding-top: 25px;
            margin-top: 10px;
        }

        .final-quote p {
            color: #5c4033;
            font-size: 1.15rem;
            line-height: 1.8;
            font-style: italic;
            margin-bottom: 20px;
        }

        .signature {
            color: #4a3121;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="moving-background"></div>

    <div class="final-card">
        <h2>last gift is here 🎁</h2>
        <p class="audio-hint">Just for my handsom baby🤍🎙️</p>

        <!-- مكان التسجيل الصوتي: سجلي كلامك بصيغة mp3 وسميه audio.mp3 وحطيه بنفس المجلد -->
        <audio controls>
            <source src="audio.mp3" type="audio/mp3">
            متصفحك ما يدعم تشغيل الصوت، معليش جرب جهاز ثاني!
        </audio>

        <div class="final-quote">
            <p>
                "ز ح ت ر 💋🫂"
            </p>
            <div class="signature">
                Happy Birthday🤍<br>
           
            </div>
        </div>
    </div>

</body>
</html>
