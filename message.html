<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Reasons & Letters For You 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fdf6f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* نفس الخلفية المتحركة عشان يكون فيه استمرارية بالجو */
        .moving-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(#f3dcd1 2px, transparent 2px),
                radial-gradient(#ffffff 1.5px, transparent 1.5px),
                radial-gradient(#f3dcd1 2px, transparent 2px);
            background-size: 40px 40px, 30px 30px, 50px 50px;
            background-position: 0 0, 15px 15px, 25px 25px;
            animation: moveStars 40s linear infinite;
            opacity: 0.8;
        }

        @keyframes moveStars {
            from { background-position: 0 0, 15px 15px, 25px 25px; }
            to { background-position: 500px 500px, 515px 515px, 525px 525px; }
        }

        h2 {
            color: #4a3121;
            font-weight: 300;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #7a5c4d;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* شبكة المربعات للـ 23 رسالة */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            max-width: 700px;
            width: 100%;
            margin-bottom: 40px;
        }

        .box {
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #e0cfc2;
            border-radius: 15px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #5c4033;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .box:hover {
            background-color: #fbeae1;
            border-color: #cbb4a3;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(92, 64, 51, 0.15);
        }

        /* صندوق الرسالة المنبثقة (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            animation: popIn 0.3s ease forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            color: #4a3121;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .modal-content p {
            color: #5c4033;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            background-color: #5c4033;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background-color: #4a3121;
        }

        /* زر الانتقال للخطوة التالية (الهدية الصوتية) */
        .next-step-btn {
            background: #fff;
            border: 2px solid #5c4033;
            color: #5c4033;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(92, 64, 51, 0.1);
            margin-top: 20px;
        }

        .next-step-btn:hover {
            background: #5c4033;
            color: #fff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="moving-background"></div>

    <h2>22 Letters For You 🤍</h2>
    <p class="subtitle">اضغط على كل رقم لتفتح رسالة خاصة لك...</p>

    <!-- شبكة المربعات من 1 إلى 23 -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- النافذة المنبثقة لعرض الرسالة -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <h3 id="modalTitle">رسالة رقم #</h3>
            <p id="modalText">هنا نص الرسالة الرائع اللي كتبتيه له...</p>
            <button class="close-btn" onclick="closeModal()">مواح 💕 🤍</button>
        </div>
    </div>

    <!-- زر الانتقال للصفحة الأخيرة (الصوتية) -->
    <button class="next-step-btn" onclick="goToFinalStep()">الهدية الأخيرة 🎁✨</button>

    <script>
       
        const messages = [
            "1.احيانا ما اقول لك قد ايش وجودك يعني لي حرفيا انت افضل شخص واحب شخص لقلبي خلق على هالكرة الارضية وجودك يعني لي كثثثييييرررر",
            "2.  حرفيا انت مو شخص يتكرر فيك اشياء كثيرة مميزة عن غيرك عشان كذا مكانتك عندي مختلفة جدا",
            "3. مممررة ممتنة لكل مرة كنت فيها جزء من يومي, حتى الايام العادية جدا, كانت افضل ايامي لانك فيها ❤️",
            "4. زيزي فخورة فييك ممررةة. مو بس بالأشياء الكبيرة الي تسويها‘ حتى بالطريقة الي تكمل فيها كل شي رغم الأشياء الي تتعبك🤍.",
            "5. اتمنى سنتك الجديدة تكون اخف عليك‘ وأهدأ على قلبك الي احبه وتجيب لك اشياء مرررة حلوة تتمناها 🦋",
            "6. تعرف شي ؟ لما يصير لي شي حلو او سيء او مخيف او ايا يكن اول شخص افكر اقول له انت عشانك تعرف كيف تسولف معاي وكيف ترد علي‘ ممووااحح 😘",
            "7. اتمنى فعلا يجي يوم ونحتفل بيوم ميلادك سوا بعطيك قبلات واحضان لامتناهية 😶‍🌫️",
            "8. شككرا مرة لانك دايم تسمع لي وتتفهمني",
            "9. this box is filled with a lot of my kisses and hugs 💋💋💋💋💋💋💋💋💋💋💋💋💋💋💋💋💋💋🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂🫂",
            "10. شكراا ممرررة عشانك متحمل نكدي ودلعي عليك بس كل دا عشاني احوووبببكك ",
            "11. ممررهه احب اني لما اكون معاك نكون على طبيعتنا كل شي غبي نسويه ونقوله بدون مانفكر حرفيا فاهمين بعض ونفس بعض لوفيوو سوومتتشش💕",
            "12. you know there is something weird about you, you can make me mad then at the same time you make me forget what i was mad about, and thats not me at all 🫥",
            "13. تحسب بسس ههذذييي السربرااييززز؟؟ لوووءء في لك سربرايز ثاني تبي تعرف وش ؟ فكر فكر فكر فكر فكر ................................................................................. ابسويلك اليوم اي شي تبيه فرصة ذهبية اي شي تقوله اعتبر جوابه ننععمم بسس انها شي واحد عشان ماتفلها او يمكن شيئين بنشوف 😶‍🌫️",
            "14. ددااييمماا اشوف المسافة بينا مممررههه مزعجة لان احيانا اتمنى اسطرك ومايمديني للاسف that is why I,m waiting for us to meet 😗",
            "15. تعرف؟ ان للحين بعد ثلاث سنوات بينا والله لاطرى اسمك ولا لاجات رسالة منك قلبي يفز وابتسامتي توصل للمريخ وفقلبي كل مرة اقول هلا والله بحبيب رووححيي بس يعني لاتشوف نفسك واجد 🤡",
            "16. كنت بكتب لك شي مؤثر هنا بس تذكرت انك بتقراه بصوتك وبتصير السالفة كرنج خل اسكت احسن 🤡",
            "17. تععررففف شييي ؟؟؟؟؟؟؟ احب لما تسولف لي عن سوالفك الي تتحمس لها وتكون مبسوط مرة فيها لاني احب اسمعك وانت متحمس واحب اسمعك لما تضحك literally the best thing I can hear in the whole world 🫂",
            "18. ايوه صح على فكرة عندك قدرة خارقة لما اكون زعلانة منك ونتكلم صوتيا حرفيا انسى وش انا كنت زعلانه منه بس اني اتغلى اهخ مواح لصوتك احلى صوت سمعته فحياتي",
            "19. اشرب موية بيب 🤡",
            "20. حبي مرة احب اعرف اخبارك حتى التفاصيل الصغيرة الغبية الي تحس انها مو مهمة مرة انبسط لما تقولها لي",
            "21.حبيبي ايا كانت سنتك الجديدة و وش بتجيب لك ابيك تعرف انك ماتحتاج تواجه كل شي لوحدك انا معاك‘ الله يخليك لي ونحتفل بذكرى ميلادك كل سنة سوا ",
            "22. I could not put my self in this box and send myself to you ... so I made you this instead 🌚 Happy birthday  to my favorite person in the whole world. love you💕 "
        ];

        const gridContainer = document.getElementById('gridContainer');
        const modal = document.getElementById('messageModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');

        // إنشاء المربعات الـ 23 تلقائياً
        for (let i = 1; i <= 22; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.innerText = i;
            box.onclick = () => showMessage(i - 1);
            gridContainer.appendChild(box);
        }

        function showMessage(index) {
            modalTitle.innerText = `رسالة رقم (${index + 1}) 💌`;
            modalText.innerText = messages[index];
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

            function goToFinalStep() {
    window.location.href = 'final.html';
        }
    </script>

</body>
</html>
